# 見た目
theme = "auto"                 # ターミナルのライト/ダークに追従
mode = "auto"                  # 画面幅で split(左右)/stack(上下) を自動切替
transparent_background = true  # ターミナル背景を活かす

# 表示
line_numbers = true
wrap_lines = true
menu_bar = true

# 挙動
vcs = "git"
watch = false                  # pager利用(stdin入力)では有効にできないため無効
                               # 直接 `hunk` を起動する時だけ --watch を付ける
exclude_untracked = false      # 新規ファイルもレビュー対象にする

# AIエージェント連携
agent_notes = true
